; ============================================================
; MESA-Net Firmware — Seeed XIAO ESP32-S3 (ESP32-S3R8)
; 240 MHz dual-core Xtensa LX7 | 8 MB PSRAM | 8 MB Flash
; 21 x 17.5 mm wearable form factor
; ============================================================

[env:xiao-esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200

; Build configuration
build_unflags =
  -std=gnu++11

; Upload configuration
; XIAO ESP32-S3 uses USB CDC — hold BOOT button then press RESET if
; auto-reset fails and you get "No serial data received."
upload_speed = 115200
upload_flags =
  --before
  usb_reset
  --after
  hard_reset

build_flags =
  -DCORE_DEBUG_LEVEL=0
  ; XIAO ESP32-S3: enable USB CDC on boot so Serial = USB CDC.
  ; This is the standard serial port shown in the Arduino IDE / pio monitor.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -std=gnu++17
  ; NOTE: Do not use -mfloat-abi=hard on ESP32-S3 (xtensa toolchain).
  ; Optimization for inference speed
  -O2

; Memory configuration — XIAO ESP32-S3 uses same OPI PSRAM as N8R8
; (ESP32-S3R8: 8 MB OPI PSRAM + 8 MB Flash)
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv

; Dependencies
lib_deps =
  bblanchon/ArduinoJson@^6.21.0

; Extra scripts (optional - for model deployment)
; extra_scripts = pre:scripts/prepare_model.py
